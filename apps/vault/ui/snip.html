<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vault - pick the QR code</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 14px; background: #1c1c1c; color: #f5f5f5;
      border: 1px solid #3a3a3a; border-left: 3px solid #B14242; font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="shot"></canvas>
  <canvas id="veil"></canvas>
  <div id="hint">Drag a box around the QR code · Esc to cancel</div>
  <script src="snip.js"></script>
</body>
</html>
