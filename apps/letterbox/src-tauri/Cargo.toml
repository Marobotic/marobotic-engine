[package]
name = "letterbox"
version = "0.1.7"
description = "Letterbox: Marobotic's mail client"
authors = ["Marobotic"]
edition = "2021"

[lib]
name = "letterbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Real Windows toasts, credited to Letterbox (see the Start menu shortcut's AppUserModelID).
tauri-winrt-notification = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
